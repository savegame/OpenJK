// Aurora gamepad default bindings.
//
// Ships with the RPM (rpm/openjk.spec) and is executed by the engine
// (code/qcommon/common.cpp, Com_ExecuteCfg -> Com_ExecuteAuroraGamepadDefaults)
// right after "exec default.cfg" and BEFORE the player's own config /
// autoexec_sp.cfg - so any bind the player changes (by hand, or via the
// in-game Controls menu) always overrides what is set here on the next
// launch. This file only ever binds the dedicated joystick keycodes
// JOY0..JOY31; it never touches a keyboard key, so it can never collide
// with the player's keyboard bindings.
//
// The gamepad itself (shared/sdl/sdl_gamepad.cpp) never calls a command
// directly - it only ever sends JOYn key events (and, for the right
// stick, plain mouse-motion events for camera look / menu cursor, which
// is why the right stick has no bind here). See sdl_gamepad.h for the
// full design rationale.
//
// Physical button (SDL_GameController)     JOYn    Default bind
// ----------------------------------------- ------- --------------------
// A                                          JOY0    +moveup      (jump)
// B                                          JOY1    +movedown    (crouch)
// X                                          JOY2    +use
// Start                                      JOY6    togglemenu   (Escape)
// Left shoulder  (LB)                        JOY9    weapprev
// Right shoulder (RB)                        JOY10   weapnext
// D-pad Up                                   JOY11   weapon 1     (saber)
// D-pad Down                                 JOY12   weapon 3     (blaster)
// D-pad Left                                 JOY13   weapon 2     (pistol)
// D-pad Right                                JOY14   weapon 9     (thermal detonator)
// Left trigger   (LT, digital)                JOY21   +altattack
// Right trigger  (RT, digital)                JOY22   +attack
// Left stick up    (digital)                  JOY23   +forward
// Left stick down  (digital)                  JOY24   +back
// Left stick left  (digital)                  JOY25   +moveleft
// Left stick right (digital)                  JOY26   +moveright
//
// Right stick: camera look in gameplay, mouse cursor in menus - sent as
// ordinary mouse-motion events, tuned by cl_gamepadLookSpeed /
// cl_gamepadMenuSpeed / cl_gamepadLookCurve (see sdl_gamepad.cpp), not a
// bind - there is nothing to set here for it.
//
// JOY3 (Y), JOY4 (Back/Select), JOY5 (Guide), JOY7/JOY8 (stick clicks) and
// JOY15..31 (extra buttons some pads expose, plus reserved slots) are
// intentionally left unbound, free for the player to assign in the
// Controls menu.

bind JOY0  "+moveup"
bind JOY1  "+movedown"
bind JOY2  "+use"
bind JOY6  "togglemenu"
bind JOY9  "weapprev"
bind JOY10 "weapnext"
bind JOY11 "weapon 1"
bind JOY12 "weapon 3"
bind JOY13 "weapon 2"
bind JOY14 "weapon 9"
bind JOY21 "+altattack"
bind JOY22 "+attack"
bind JOY23 "+forward"
bind JOY24 "+back"
bind JOY25 "+moveleft"
bind JOY26 "+moveright"
