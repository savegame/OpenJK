// Aurora gamepad default bindings.
//
// Ships with the RPM (rpm/openjk.spec) and is executed by the engine
// (code/qcommon/common.cpp, Com_ExecuteCfg -> Com_ExecuteAuroraGamepadDefaults)
// right after "exec default.cfg" and BEFORE the player's own config /
// autoexec_sp.cfg - so any bind the player changes (by hand, or via the
// in-game Controls menu) always overrides what is set here on the next
// launch. This file only ever binds the dedicated joystick keycodes
// JOY0..JOY31; it never touches a keyboard key, so it can never collide
// with the player's keyboard bindings.
//
// The gamepad itself (shared/sdl/sdl_gamepad.cpp) never calls a command
// directly - it only ever sends JOYn key events (and, for the right
// stick, plain mouse-motion events for camera look / menu cursor, which
// is why the right stick has no bind here). See sdl_gamepad.h for the
// full design rationale.
//
// Physical button (SDL_GameController)     JOYn    Default bind
// ----------------------------------------- ------- --------------------
// A                                          JOY0    +moveup      (jump)
// B                                          JOY1    +movedown    (crouch)
// X                                          JOY2    +use
// Y                                          JOY3    +useforce
// Start                                      JOY6    togglemenu   (Escape)
// Left stick click  (L3)                     JOY7    +useforce
// Right stick click (R3)                     JOY8    +movedown    (crouch, so a roll can be done off the right stick too)
// Left shoulder  (LB)                        JOY9    weapprev
// Right shoulder (RB)                        JOY10   weapnext
// D-pad Up                                   JOY11   weapon 1     (saber)
// D-pad Down                                 JOY12   weapon 3     (blaster)
// D-pad Left                                 JOY13   forceprev
// D-pad Right                                JOY14   forcenext
// Left trigger   (LT, digital)                JOY21   +altattack
// Right trigger  (RT, digital)                JOY22   +attack
//
// +useforce is intentionally bound twice (JOY3 and JOY7): Y is the
// primary button, and the left stick click is a mandatory second bind
// per B-004 (in case Y ends up wanted for something else later, or a
// pad maps Y differently). This is safe, not a "last bind wins"
// situation and not a stuck-key risk: kbutton_t (code/client/cl_input.cpp)
// tracks up to two physical keys per action in down[0]/down[1] with a
// small reference count - IN_KeyDown() records whichever slot is free,
// IN_KeyUp() clears only the matching slot, and the action only goes
// inactive once BOTH slots are empty. So pressing Y and L3 together (or
// releasing one while the other is still held) can never leave force-use
// "stuck on". This is the same mechanism the engine already uses for e.g.
// binding both W and the up-arrow to +forward in default.cfg.
//
// D-pad Left/Right lose their quick weapon-select binds (previously
// "weapon 2" / "weapon 9") to make room for forceprev/forcenext (B-004).
// They are deliberately left unassigned rather than moved to another
// JOYn: every other free button already has a job (Y and left-stick
// click are now +useforce; Back/Guide are reserved system buttons, see
// below). Saber and blaster keep their one-touch D-pad Up/Down binds
// (the two weapons players reach for most in a lightsaber game); pistol,
// thermal detonator and everything else remain reachable by cycling with
// weapprev/weapnext (LB/RB), same as before this change.
//
// Left stick: analog, variable-speed movement (walk at partial deflection,
// smoothly up to full run at full deflection) - read directly by the
// engine (CL_AuroraGamepadMove, code/client/cl_input.cpp) as continuous
// forward/strafe, tuned by cl_gamepadDeadZone / cl_gamepadMoveCurve (see
// sdl_gamepad.cpp). This is NOT a bind and there is nothing to set here
// for it - it is not JOY23..26 below.
//
// Right stick: camera look in gameplay, mouse cursor in menus - sent as
// ordinary mouse-motion events, tuned by cl_gamepadLookSpeed /
// cl_gamepadMenuSpeed / cl_gamepadLookCurve (see sdl_gamepad.cpp), not a
// bind - there is nothing to set here for it.
//
// JOY4 (Back/Select), JOY5 (Guide) and JOY15..31 (extra buttons some pads
// expose, plus reserved slots) are intentionally left unbound, free for
// the player to assign in the Controls menu. This includes JOY23..26
// (left stick digitised into four directions, up/down/left/right against
// cl_gamepadDeadZone) - they still
// exist and can still be bound (e.g. "bind JOY23 +forward" for classic
// dpad-style digital movement instead of the analog default above), but
// are deliberately not bound by default any more: a digital bind can only
// ever be "pressed" or "not pressed", which is exactly the fixed-speed,
// no-in-between feel the analog path above replaced.

bind JOY0  "+moveup"
bind JOY1  "+movedown"
bind JOY2  "+use"
bind JOY3  "+useforce"
bind JOY6  "togglemenu"
bind JOY7  "+useforce"
bind JOY8  "+movedown"
bind JOY9  "weapprev"
bind JOY10 "weapnext"
bind JOY11 "weapon 1"
bind JOY12 "weapon 3"
bind JOY13 "forceprev"
bind JOY14 "forcenext"
bind JOY21 "+altattack"
bind JOY22 "+attack"
